services:
  postgres:
    image: postgres:16-alpine
    container_name: simulador-inversiones-db
    environment:
      POSTGRES_DB: simulador_inversiones
      POSTGRES_USER: simulador
      POSTGRES_PASSWORD: simulador
    ports:
      - "5433:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data

volumes:
  datos_postgres:
